{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm p-4">
  <h4>¿Eliminar la parcela «{{ object.nombre }}»?</h4>
  <p class="text-muted">Esta acción no se puede deshacer.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger">Sí, eliminar</button>
    <a class="btn btn-link" href="{% url 'parcelas:lista' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
